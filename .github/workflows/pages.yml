# Publishes the operational app, with the explanatory pages behind it.
#
# The app is the product: app/index.html serves at the root, and the system
# briefs it links to are published alongside. What still never ships is the
# engine -- platform/ -- which holds the fetchers, the DuckDB database and the
# credentials-free source registry. That runs on the operator's own machine.
#
# Published:     app/index.html -> /, app/mobile.html, app/assets, app/data,
#                systems/, platform.html, research.html, examples.html,
#                app/admin.html (noindex), 404.html, sitemap.xml, robots.txt,
#                CNAME, assets/
# Not published: platform/ (the engine), data/ (raw content modules), research/
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the website
        run: |
          mkdir -p _site/assets

          # The app, at the root. Its own relative paths (assets/, data/) work
          # unchanged there, and its links to ../systems/ resolve to /systems/.
          cp app/index.html app/mobile.html app/admin.html _site/
          cp -r app/assets/. _site/assets/
          cp -r app/data _site/data

          # The explanatory pages the app links out to.
          cp platform.html research.html examples.html 404.html _site/
          cp -r systems _site/
          cp -r assets/. _site/assets/

          cp sitemap.xml robots.txt _site/
          cp .nojekyll LICENSE CNAME _site/ 2>/dev/null || true


      - name: Refuse to publish the system
        run: |
          # The engine never ships. It holds the fetchers, the source registry and
          # the database the app's figures are computed from; publishing it would
          # put the operator's whole pipeline on the public web.
          for forbidden in platform research; do
            if [ -e "_site/$forbidden" ]; then
              echo "::error::_site contains $forbidden — the engine must stay local"
              exit 1
            fi
          done
          # The console is published but must stay out of search: it is an
          # operations view, and it has no business competing with the product.
          if ! grep -q 'name="robots" content="noindex' _site/admin.html; then
            echo "::error::admin.html is published without noindex"
            exit 1
          fi
          # The app must actually be at the root, or the deploy silently serves
          # the old proposal site instead of the product.
          if ! grep -q 'public interface' _site/index.html; then
            echo "::error::_site/index.html is not the app"
            exit 1
          fi
          echo "checked: app at root, engine absent, console absent"

      - name: Check every sitemap URL ships
        run: |
          # A sitemap entry for a page that is not in the artifact is a 404
          # served to a crawler, and Search Console reports it as an error.
          missing=0
          grep -o '<loc>[^<]*</loc>' _site/sitemap.xml \
            | sed 's|<loc>https://[^/]*/uk-open-data-systems/||; s|</loc>||' \
            | while read -r path; do
                [ -z "$path" ] && path="index.html"
                if [ ! -f "_site/$path" ]; then
                  echo "::error::sitemap lists $path, which is not published"
                  missing=1
                fi
              done
          test "$missing" -eq 0
          echo "checked: every sitemap URL is present"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
